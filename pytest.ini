[pytest]
testpaths = webnovel-writer/scripts/data_modules/tests webnovel-writer/scripts/tests
pythonpath = webnovel-writer/scripts
# -p asyncio 显式加载 pytest-asyncio（test_api_client / test_rag_adapter 依赖），
# 这样无论 PYTEST_DISABLE_PLUGIN_AUTOLOAD 是否生效都能跑通。
addopts = -p no:anyio -p asyncio -p no:debugging -p pytest_cov -q --cov --cov-report=term-missing --cov-fail-under=90 -p no:cacheprovider
asyncio_mode = strict
